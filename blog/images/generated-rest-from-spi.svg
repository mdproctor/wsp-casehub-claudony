<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
    <marker id="ag" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
  </defs>

  <rect width="700" height="300" rx="8" fill="#0f172a"/>

  <text x="350" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">One SPI, Three Surfaces</text>

  <!-- SPI class -->
  <rect x="230" y="48" width="240" height="60" rx="8" fill="#172554" stroke="#3b82f6"/>
  <text x="350" y="72" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">@McpDomain ClaudonyPoolApi</text>
  <text x="350" y="90" text-anchor="middle" fill="#64748b" font-size="11">@PlatformQuery + @RestPath</text>

  <!-- Three arrows down -->
  <line x1="200" y1="108" x2="130" y2="148" stroke="#94a3b8" marker-end="url(#a)"/>
  <line x1="350" y1="108" x2="350" y2="148" stroke="#22c55e" marker-end="url(#ag)"/>
  <line x1="500" y1="108" x2="570" y2="148" stroke="#94a3b8" marker-end="url(#a)"/>

  <!-- MCP -->
  <rect x="40" y="152" width="180" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="130" y="174" text-anchor="middle" fill="#e2e8f0" font-size="12">MCP Tool</text>
  <text x="130" y="190" text-anchor="middle" fill="#64748b" font-size="10">POST /mcp (JSON-RPC)</text>

  <!-- REST (generated) -->
  <rect x="260" y="152" width="180" height="50" rx="6" fill="#1e3a2a" stroke="#22c55e"/>
  <text x="350" y="174" text-anchor="middle" fill="#86efac" font-size="12">REST Resource</text>
  <text x="350" y="190" text-anchor="middle" fill="#64748b" font-size="10">Generated by APT</text>

  <!-- GraphQL -->
  <rect x="480" y="152" width="180" height="50" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="570" y="174" text-anchor="middle" fill="#e2e8f0" font-size="12">GraphQL Resolver</text>
  <text x="570" y="190" text-anchor="middle" fill="#64748b" font-size="10">Optional (off in Claudony)</text>

  <!-- Before/After -->
  <rect x="40" y="230" width="300" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="190" y="250" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="600">Before: hand-written PoolResource</text>
  <text x="190" y="268" text-anchor="middle" fill="#64748b" font-size="10">113 lines, @Deprecated, @Authenticated, @RolesAllowed</text>

  <rect x="360" y="230" width="300" height="55" rx="6" fill="#1e3a2a" stroke="#22c55e"/>
  <text x="510" y="250" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">After: generated ClaudonyPoolsResource</text>
  <text x="510" y="268" text-anchor="middle" fill="#64748b" font-size="10">87 lines, auto-generated, @Transactional, @RunOnVirtualThread</text>
</svg>
