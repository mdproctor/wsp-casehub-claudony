<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#94a3b8"/>
    </marker>
    <marker id="ag1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
    <marker id="ar1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="ay1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f59e0b"/>
    </marker>
  </defs>

  <rect width="680" height="300" rx="8" fill="#0f172a"/>
  <text x="340" y="28" text-anchor="middle" fill="#e2e8f0" font-size="15" font-weight="600">Delegation Validation — Org-Aware Agent Routing</text>

  <!-- Agent A wants to delegate to Agent B -->
  <rect x="40" y="55" width="140" height="44" rx="6" fill="#172554" stroke="#3b82f6"/>
  <text x="110" y="74" text-anchor="middle" fill="#93c5fd" font-size="12">Agent A</text>
  <text x="110" y="90" text-anchor="middle" fill="#64748b" font-size="10">(manager)</text>

  <line x1="180" y1="77" x2="230" y2="77" stroke="#94a3b8" marker-end="url(#a1)"/>
  <text x="205" y="70" text-anchor="middle" fill="#94a3b8" font-size="10">delegates</text>

  <rect x="232" y="55" width="140" height="44" rx="6" fill="#172554" stroke="#3b82f6"/>
  <text x="302" y="74" text-anchor="middle" fill="#93c5fd" font-size="12">Agent B</text>
  <text x="302" y="90" text-anchor="middle" fill="#64748b" font-size="10">(worker)</text>

  <!-- DelegationValidator -->
  <line x1="302" y1="99" x2="302" y2="125" stroke="#94a3b8" marker-end="url(#a1)"/>

  <rect x="192" y="128" width="220" height="44" rx="6" fill="#1e293b" stroke="#f59e0b"/>
  <text x="302" y="148" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">DelegationValidator</text>
  <text x="302" y="164" text-anchor="middle" fill="#64748b" font-size="10">canDelegateTo(A, B, tenancy)?</text>

  <!-- Decision diamond -->
  <polygon points="302,185 352,210 302,235 252,210" fill="#1e293b" stroke="#f59e0b"/>
  <text x="302" y="214" text-anchor="middle" fill="#fbbf24" font-size="10">org?</text>

  <!-- No org structure path -->
  <line x1="252" y1="210" x2="100" y2="210" stroke="#22c55e" marker-end="url(#ag1)"/>
  <text x="176" y="203" text-anchor="middle" fill="#86efac" font-size="10">no org structure</text>
  <rect x="20" y="195" width="80" height="30" rx="5" fill="#1e3a2a" stroke="#22c55e"/>
  <text x="60" y="215" text-anchor="middle" fill="#86efac" font-size="11">✓ allow</text>

  <!-- Has org structure -->
  <line x1="352" y1="210" x2="430" y2="210" stroke="#94a3b8" marker-end="url(#a1)"/>
  <text x="391" y="203" text-anchor="middle" fill="#94a3b8" font-size="10">check</text>

  <!-- Second decision -->
  <polygon points="490,195 540,210 490,225 440,210" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="214" text-anchor="middle" fill="#e2e8f0" font-size="10">allowed?</text>

  <!-- Allowed -->
  <line x1="540" y1="210" x2="610" y2="210" stroke="#22c55e" marker-end="url(#ag1)"/>
  <rect x="612" y="195" width="50" height="30" rx="5" fill="#1e3a2a" stroke="#22c55e"/>
  <text x="637" y="215" text-anchor="middle" fill="#86efac" font-size="11">✓</text>

  <!-- Not allowed -->
  <line x1="490" y1="225" x2="490" y2="248" stroke="#94a3b8" marker-end="url(#a1)"/>

  <!-- Strictness decision -->
  <rect x="415" y="252" width="150" height="36" rx="5" fill="#1e293b" stroke="#334155"/>
  <text x="490" y="275" text-anchor="middle" fill="#e2e8f0" font-size="11">strictness mode?</text>

  <!-- Permissive -->
  <line x1="415" y1="270" x2="310" y2="270" stroke="#f59e0b" marker-end="url(#ay1)"/>
  <rect x="200" y="255" width="110" height="30" rx="5" fill="#2a2a1e" stroke="#f59e0b"/>
  <text x="255" y="275" text-anchor="middle" fill="#fbbf24" font-size="11">⚠ warn + allow</text>

  <!-- Strict -->
  <line x1="565" y1="270" x2="610" y2="270" stroke="#ef4444" marker-end="url(#ar1)"/>
  <rect x="612" y="255" width="50" height="30" rx="5" fill="#2a1e1e" stroke="#ef4444"/>
  <text x="637" y="275" text-anchor="middle" fill="#fca5a5" font-size="11">✗</text>

  <text x="360" y="280" text-anchor="middle" fill="#64748b" font-size="9">permissive</text>
  <text x="588" y="263" text-anchor="middle" fill="#64748b" font-size="9">strict</text>
</svg>
